server {
    # listen [::]:80;
    # listen [::]:443 ssl;
    server_name lukas-messenger.de www.lukas-messenger.de;

    root /var/www/html/whatsapp-bot/frontend/vue-project/dist;
    index index.html;

    # ACME Challenge für Certbot
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html/whatsapp-bot;
    }

    # Vue Frontend
    location / {
       try_files $uri /index.html;
    }



    # Serve Laravel storage files (uploaded images, etc.)
    location /storage {
        alias /var/www/html/whatsapp-bot/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' 'https://lukas-messenger.de' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }




location /api/ {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'https://lukas-messenger.de' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '3600' always;
        add_header 'Content-Length' '0';
        add_header 'Content-Type' 'text/plain';
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' 'https://lukas-messenger.de' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
}


location /broadcasting/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
}




    # Node.js WhatsApp + Soketi
    location /ws/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }


location /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Origin $scheme://$host;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_cache_bypass $http_upgrade;
}

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lukas-messenger.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lukas-messenger.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;




location /phpmyadmin {
    root /usr/share/;
    index index.php index.html index.htm;
    auth_basic "Restricted Area";
    auth_basic_user_file /etc/nginx/.phpmyadmin_passwd;

    location ~ ^/phpmyadmin/(.+\.php)$ {
        root /usr/share/;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* ^/phpmyadmin/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$ {
        root /usr/share/;
    }
}







}
server {
    if ($host = www.lukas-messenger.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lukas-messenger.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name lukas-messenger.de www.lukas-messenger.de;
    return 404; # managed by Certbot




}

